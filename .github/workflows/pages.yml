# Sestaví stránku ze zdrojů a vystaví ji na GitHub Pages.
# Spouští se ručně: záložka Actions, "Publikovat na GitHub Pages", Run workflow (nebo `gh workflow run pages.yml`).
name: Publikovat na GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Sestavit index.html a index.packed.html
        working-directory: source
        run: npm ci && npm run build:packed
      - name: Připravit obsah webu
        run: mkdir _site && cp index.html index.packed.html manifest.webmanifest sw.js icon-*.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
